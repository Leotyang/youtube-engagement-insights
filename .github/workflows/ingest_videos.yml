# Nightly: sync the creator list from the Google Sheet (channels removed from the sheet are deleted from
# BigQuery), add new videos, refresh every video's metadata, and write today's partition of
# video_daily_snapshots and channel_daily_snapshots. Trait tagging is the separate "Tag videos"
# workflow, an hour later.
# Runs on the default branch only (GitHub cron rule). Trigger manually via "Run workflow".
name: Ingest videos

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC daily = 02:00 PT (YouTube API quota resets at midnight PT)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write Google service-account key
        env:
          GCP_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GCP_KEY_JSON" > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Pull channels, videos, engagement into BigQuery
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python src/ingest.py --env github
