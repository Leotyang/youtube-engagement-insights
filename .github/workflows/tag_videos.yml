# Nightly: refresh the video list, then score as many untagged videos as the Gemini free
# tier allows (~8h of video/day), and commit the CSVs back so results persist.
# Runs on the default branch only (GitHub cron rule). Trigger manually via "Run workflow".
name: Ingest and tag videos

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC daily = 02:00 PT (free-tier quota resets at midnight PT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull channels, videos, engagement
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python src/ingest.py

      - name: Tag videos with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/tag_videos.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No data changes" && exit 0
          git commit -m "Nightly ingest + trait tagging ($(date -u +%Y-%m-%d))"
          git push
